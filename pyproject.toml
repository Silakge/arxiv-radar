[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-radar"
version = "0.1.0"
description = "Track your research field on autopilot - a zero-config arXiv monitor that turns new papers into a beautiful daily digest (Markdown / HTML / RSS)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "arxiv-radar contributors" }]
keywords = [
  "arxiv",
  "papers",
  "research",
  "literature",
  "digest",
  "llm",
  "academia",
  "github-actions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "feedparser>=6.0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
arxiv-radar = "arxiv_radar.cli:main"

[project.urls]
Homepage = "https://github.com/Silakge/arxiv-radar"
Repository = "https://github.com/Silakge/arxiv-radar"
Issues = "https://github.com/Silakge/arxiv-radar/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arxiv_radar.templates" = ["*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
