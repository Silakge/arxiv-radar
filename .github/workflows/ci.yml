name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Python 3.9 is EOL and no longer in setup-python's manifest for the
        # ubuntu-latest (26.04) image — pin it to ubuntu-24.04 there.
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke test (offline paths only)
        # bash shell so `< /dev/null` works on Windows runners too (PowerShell
        # reserves `<`); a relative config path avoids /tmp differences.
        shell: bash
        run: |
          arxiv-radar --version
          arxiv-radar init --config radar-smoke.yaml < /dev/null
          arxiv-radar check --config radar-smoke.yaml
