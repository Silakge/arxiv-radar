name: Release

# Publish to PyPI via Trusted Publishing (OIDC) — no API token stored anywhere.
# One-time setup on PyPI: register a *pending publisher* at
# https://pypi.org/manage/account/publishing/ with:
#   PyPI project name:  arxiv-radar
#   Owner:              Silakge
#   Repository:         arxiv-radar
#   Workflow filename:  release.yml
#   Environment name:   pypi
# Then push a tag (`git tag v0.1.0 && git push origin v0.1.0`) to release.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mandatory for trusted publishing: exchanges the Actions OIDC token
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
